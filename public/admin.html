<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1B3F">
  <title>Payment links</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/admin.js" defer></script>
</head>
<body class="admin">
  <header class="topbar">
    <div class="topbar-inner">
      <img class="brand-logo" src="/logo.svg" alt="" width="34" height="34">
      <span class="brand-name" id="brandName">&nbsp;</span>
      <span class="tag">Payment links</span>
      <span class="grow"></span>
      <button class="copy" type="button" id="logoutBtn" hidden>Sign out</button>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="banner" id="mockBanner" hidden><span class="dot" aria-hidden="true"></span>Test mode — no real payment will be made.</div>

    <div class="login-wrap" id="loginView" hidden>
      <section class="card">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to create and track payment links.</p>
        <form id="loginForm">
          <label class="field">
            <span>Admin password</span>
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="error" id="loginError" role="alert" hidden></p>
          <button class="btn primary" type="submit">Sign in</button>
        </form>
      </section>
    </div>

    <div class="admin-grid" id="appView" hidden>
      <section class="card">
        <h1>New payment link</h1>
        <form id="linkForm" novalidate>
          <label class="field">
            <span>Amount</span>
            <div class="amount-row">
              <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" required>
              <select id="currency" aria-label="Currency"></select>
            </div>
          </label>
          <label class="field">
            <span>Reference <em>(optional — generated if empty)</em></span>
            <input id="order_id" type="text" maxlength="64" autocomplete="off" placeholder="INV-22">
          </label>
          <label class="field">
            <span>What it's for <em>(shown to the customer)</em></span>
            <input id="description" type="text" maxlength="200" autocomplete="off" placeholder="Gold scheme — November">
          </label>
          <p class="error" id="linkError" role="alert" hidden></p>
          <button class="btn primary" type="submit" id="createBtn">Create link</button>
        </form>

        <div class="created" id="created" hidden>
          <div class="label">Link ready — send it to the customer</div>
          <div class="mono-row">
            <code id="createdUrl"></code>
            <button class="copy" type="button" id="copyCreated">Copy</button>
          </div>
          <p class="muted small" id="createdNote"></p>
        </div>
      </section>

      <section class="card">
        <div class="stats">
          <div class="stat wait"><b id="statOpen">0</b><span>Awaiting payment</span></div>
          <div class="stat good"><b id="statPaid">0</b><span>Paid</span></div>
          <div class="stat"><b id="statTotal">0</b><span>Total links</span></div>
        </div>
        <div class="list-head">
          <h2>Links</h2>
          <button class="copy" type="button" id="refreshBtn">Refresh</button>
        </div>
        <div id="links"></div>
      </section>
    </div>
  </div>
</body>
</html>
